spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/inventario_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:inventario_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:inventario_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=America/Bogota
server.port=8080
management.endpoints.web.exposure.include=health
spring.jpa.defer-datasource-initialization=true
